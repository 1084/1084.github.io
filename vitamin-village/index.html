<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FBFAF7">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vitamin Village">
<title>Vitamin Village</title>

<!--
  VITAMIN VILLAGE — clickable prototype
  =====================================
  This is ONE self-contained file. No internet or installation needed:
  just open it in any web browser (double-click it, or open it on your phone).

  It is written to be READ as you learn to code. The three languages here are:
    - HTML  (the structure / content)  ..... the <body> below
    - CSS   (the look / styling)       ..... inside <style>
    - JS    (the behaviour / logic)    ..... inside <script> at the bottom

  ART TIP: every character everywhere is drawn by ONE function, avatar().
  Want to change how the characters look? Edit avatar() (search for it below)
  and the whole app updates at once — the village, the result screen, and the
  badges all call the same function.
-->

<style>
  /* ---------- Design tokens (change these to re-skin the whole app) ---------- */
  :root{
    --bg:#FBFAF7; --card:#FFFFFF; --ink:#2C2C2A; --muted:#6B6A64;
    --line:#EDEAE2; --radius:18px; --radius-sm:12px;
    --buddy:#1D9E75; --buddy-bg:#E1F5EE;
    --space:#E0862B; --space-bg:#FBEEDD;
    --fine:#888780; --fine-bg:#F1EFE8;
    --shadow:0 2px 10px rgba(0,0,0,.05);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:#E8E5DD;color:var(--ink);}

  /* Phone frame so it looks like a real device on a big screen. */
  #phone{max-width:420px;margin:0 auto;min-height:100vh;background:var(--bg);
    position:relative;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.12);}

  /* Each "screen" is a full panel; only the active one shows. */
  .screen{display:none;flex:1;flex-direction:column;padding:20px 18px 92px;overflow-y:auto;}
  .screen.active{display:flex;}

  h1{font-size:24px;margin:4px 0 2px;font-weight:700;}
  h2{font-size:19px;margin:0 0 10px;font-weight:600;}
  p{line-height:1.55;margin:0 0 12px;}
  .muted{color:var(--muted);}
  .center{text-align:center;}

  button{font-family:inherit;font-size:16px;cursor:pointer;border:none;}
  .btn{background:var(--ink);color:#fff;border-radius:999px;padding:14px 22px;
    font-weight:600;width:100%;box-shadow:var(--shadow);}
  .btn.light{background:#fff;color:var(--ink);border:1.5px solid var(--line);}
  .btn:active{transform:scale(.98);}

  /* Tiny symbol chip, used inline in tight spaces (recipe pair badges). */
  .chip{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;
    justify-content:center;font-size:9px;font-weight:700;}

  /* ---------- Village grid ---------- */
  .progress{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 16px;margin-bottom:16px;box-shadow:var(--shadow);}
  .bar{height:9px;background:var(--fine-bg);border-radius:99px;overflow:hidden;margin-top:8px;}
  .bar > i{display:block;height:100%;background:var(--buddy);width:0;transition:width .5s ease;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .charcard{background:var(--card);border:2px solid var(--line);border-radius:var(--radius-sm);
    padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;
    transition:transform .08s,border-color .15s;}
  .charcard:active{transform:scale(.96);}
  .charcard.sel{border-color:var(--ink);}
  .charcard .nm{font-size:13px;font-weight:600;}
  .charcard .nt{font-size:11px;color:var(--muted);}

  .hint{font-size:15px;color:var(--muted);text-align:center;margin-bottom:14px;}

  /* ---------- Result card ---------- */
  .result{background:var(--card);border-radius:var(--radius);padding:22px 18px;
    text-align:center;box-shadow:var(--shadow);border:1px solid var(--line);}
  .facepair{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin-bottom:10px;}
  .verdict{font-size:22px;font-weight:700;margin:6px 0;}
  .chiplabel{display:inline-block;font-size:13px;font-weight:600;padding:6px 14px;border-radius:999px;margin-top:6px;}
  .expander{margin-top:16px;text-align:left;background:var(--fine-bg);border-radius:var(--radius-sm);
    padding:12px 14px;font-size:14px;color:var(--muted);}

  .newbadge{display:inline-block;background:var(--buddy);color:#fff;font-size:12px;font-weight:700;
    padding:4px 12px;border-radius:999px;margin-bottom:8px;}

  /* ---------- Food finder ---------- */
  .search{width:100%;padding:13px 16px;border:1.5px solid var(--line);border-radius:999px;
    font-size:16px;font-family:inherit;margin-bottom:12px;}
  .foodrow{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:12px 14px;margin-bottom:9px;display:flex;align-items:center;gap:12px;}
  .foodrow .fn{font-weight:600;font-size:15px;}
  .foodrow .fc{font-size:12px;color:var(--muted);}
  .dots{display:flex;gap:5px;margin-left:auto;flex:none;}
  .dot{width:26px;height:26px;border-radius:50%;font-size:11px;font-weight:700;
    display:flex;align-items:center;justify-content:center;}

  /* ---------- Recipes ---------- */
  .recipecard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:14px 16px;margin-bottom:11px;box-shadow:var(--shadow);}
  .recipecard .rt{font-weight:600;font-size:16px;margin-bottom:6px;}
  .meta{font-size:12px;color:var(--muted);}
  .pairbadge{display:inline-flex;align-items:center;gap:6px;background:var(--buddy-bg);
    color:#0d5c44;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;}
  .check{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);
    font-size:15px;cursor:pointer;}
  .check .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);flex:none;
    display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;}
  .check.done .box{background:var(--buddy);border-color:var(--buddy);}
  .check.done .txt{text-decoration:line-through;color:var(--muted);}
  .backlink{background:none;color:var(--muted);font-weight:600;padding:0;margin-bottom:12px;font-size:15px;}

  /* ---------- Reward / collection ---------- */
  .badgegrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
  .badge{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:14px 10px;text-align:center;}
  .badge.locked{opacity:.4;}
  .badge .bp{display:flex;justify-content:center;align-items:flex-end;gap:4px;margin-bottom:8px;}
  .badge .bn{font-size:12px;font-weight:600;}
  .celebrate{background:var(--buddy-bg);border:1px solid var(--buddy);border-radius:var(--radius);
    padding:18px;text-align:center;margin-bottom:16px;}

  /* ---------- Bottom nav ---------- */
  #nav{position:absolute;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);
    display:flex;padding:8px 4px calc(8px + env(safe-area-inset-bottom));}
  #nav button{flex:1;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:11px;color:var(--muted);padding:6px 0;font-weight:600;}
  #nav button.on{color:var(--ink);}
  #nav .ic{font-size:20px;line-height:1;}

  /* ---------- Onboarding ---------- */
  #onboard{position:absolute;inset:0;background:var(--bg);z-index:20;display:flex;
    flex-direction:column;justify-content:center;padding:32px 26px;}
  .obcard{text-align:center;}
  .dots-nav{display:flex;justify-content:center;gap:8px;margin:22px 0;}
  .dots-nav i{width:8px;height:8px;border-radius:50%;background:var(--line);}
  .dots-nav i.on{background:var(--ink);width:22px;border-radius:99px;}
</style>
</head>

<body>
<div id="phone">

  <!-- ============ ONBOARDING (shows first, then hides) ============ -->
  <div id="onboard">
    <div class="obcard" id="ob-content"></div>
    <div class="dots-nav" id="ob-dots"></div>
    <button class="btn" id="ob-next">Next</button>
  </div>

  <!-- ============ SCREEN: VILLAGE ============ -->
  <section class="screen active" id="s-village">
    <h1>Vitamin Village</h1>
    <div class="progress">
      <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:600;">
        <span>Buddies discovered</span><span id="prog-count">0 / 10</span>
      </div>
      <div class="bar"><i id="prog-bar"></i></div>
    </div>
    <p class="hint" id="village-hint">Tap two friends to see what happens!</p>
    <div class="grid" id="grid"></div>
  </section>

  <!-- ============ SCREEN: RESULT ============ -->
  <section class="screen" id="s-result">
    <button class="backlink" onclick="go('village')">‹ Back to the village</button>
    <div class="result" id="result-body"></div>
    <div style="height:14px"></div>
    <button class="btn light" onclick="clearPick();go('village')">Try another pair</button>
  </section>

  <!-- ============ SCREEN: FOOD FINDER ============ -->
  <section class="screen" id="s-foods">
    <h1>Food Finder</h1>
    <p class="muted" style="margin-top:-4px">Where do the helpers hide? Search a food.</p>
    <input class="search" id="food-search" placeholder="Search foods, e.g. spinach">
    <div id="food-list"></div>
  </section>

  <!-- ============ SCREEN: RECIPES (list) ============ -->
  <section class="screen" id="s-recipes">
    <h1>Recipe Box</h1>
    <p class="muted" style="margin-top:-4px">Meals that put buddy nutrients together.</p>
    <div id="recipe-list"></div>
  </section>

  <!-- ============ SCREEN: RECIPE DETAIL ============ -->
  <section class="screen" id="s-recipe">
    <button class="backlink" onclick="go('recipes')">‹ All recipes</button>
    <div id="recipe-detail"></div>
  </section>

  <!-- ============ SCREEN: REWARD / COLLECTION ============ -->
  <section class="screen" id="s-reward">
    <h1>My Buddy Badges</h1>
    <div id="reward-body"></div>
  </section>

  <!-- ============ SCREEN: COMBO MAKER ============ -->
  <section class="screen" id="s-combo">
    <h1>Mix &amp; Match</h1>
    <p class="muted" style="margin-top:-4px">Pick a buddy team and get a food idea to try.</p>
    <div id="combo-pairs" style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px"></div>
    <div id="combo-card"></div>
  </section>

  <!-- ============ BOTTOM NAV ============ -->
  <nav id="nav">
    <button data-go="village" class="on"><span class="ic">●</span>Village</button>
    <button data-go="foods"><span class="ic">◆</span>Foods</button>
    <button data-go="recipes"><span class="ic">▲</span>Recipes</button>
    <button data-go="combo"><span class="ic">⬡</span>Mix</button>
    <button data-go="reward"><span class="ic">★</span>Badges</button>
  </nav>
</div>

  Fruit:"sweet", Berry:"sweet", Citrus:"sweet", "Dried fruit":"sweet", Treat:"sweet", Drink:"sweet",
  Vegetable:"savory", "Leafy green":"savory", Legume:"savory", Fish:"savory",
  Meat:"savory", "Sea vegetable":"savory", Herb:"savory", Protein:"savory",
  Nut:"neutral", Seed:"neutral", Dairy:"neutral", Oil:"neutral", Grain:"neutral",
};
function flavorOK(f1, f2){
  const a = FLAVOR[f1.cat] || "neutral", b = FLAVOR[f2.cat] || "neutral";
  return !((a === "sweet" && b === "savory") || (a === "savory" && b === "sweet"));
}

/* =========================================================================
   2) STATE  — what the app remembers while it runs
   ========================================================================= */
const pick = [];                 // the 1-2 characters currently tapped
const discovered = new Set();    // buddy pair keys the player has found
// (To make this survive closing the app, you'd later save `discovered` to
//  the browser with localStorage. Left out here so it runs anywhere.)

/* =========================================================================
   3) THE CHARACTER ART  — edit avatar() to change how everyone looks!
   =========================================================================
   avatar(c, w) draws one jersey mascot for character `c` at width `w` px.
   It is ONE template: same friendly face + jersey shape for everyone, only
   the colors and the crest symbol change (from the DATA above). Because every
   screen calls this one function, editing it here restyles the ENTIRE app.
   Ideas to try: change the jersey `<path>`, add a collar stripe, swap the
   face, or give each character a little prop.
*/
function avatar(c, w){
  w = w || 82;
  const h = Math.round(w * 120 / 90);
  const two = c.sym.length > 1;                 // 2-char symbols (Ca, Mg…) use smaller text
  return `<svg viewBox="0 0 90 120" width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg" aria-label="${c.name}, ${c.nutrient}">
    <ellipse cx="18" cy="61" rx="9" ry="11" fill="${c.jersey}"/>
    <ellipse cx="72" cy="61" rx="9" ry="11" fill="${c.jersey}"/>
    <path d="M23,50 Q45,43 67,50 L63,106 Q63,110 59,110 L31,110 Q27,110 27,106 Z" fill="${c.jersey}"/>
    <path d="M37,48 Q45,55 53,48 Q52,52 45,53 Q38,52 37,48 Z" fill="#ffffff" opacity="0.9"/>
    <circle cx="45" cy="26" r="17" fill="#F6DFC4"/>
    <circle cx="34" cy="31" r="2.4" fill="#E58AA0" opacity="0.4"/>
    <circle cx="56" cy="31" r="2.4" fill="#E58AA0" opacity="0.4"/>
    <circle cx="39" cy="25" r="2.3" fill="#3a3a38"/>
    <circle cx="51" cy="25" r="2.3" fill="#3a3a38"/>
    <path d="M39,32 Q45,37 51,32" stroke="#3a3a38" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="45" cy="77" r="13" fill="#ffffff" stroke="${c.ink}" stroke-width="1.5"/>
    <text x="45" y="77" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-weight="700" font-size="${two ? 12 : 15}" fill="${c.ink}">${c.sym}</text>
  </svg>`;
}

// A tiny symbol chip for inline use where a full avatar would be too small.
function chip(c){
  return `<span class="chip" style="background:${c.bg};color:${c.ink}">${c.sym}</span>`;
}

/* =========================================================================
   4) SMALL HELPERS
   ========================================================================= */
const $ = sel => document.querySelector(sel);
function ruleKey(a, b){ return [a,b].sort().join("_"); }   // the sorted lookup key

/* =========================================================================
   5) SCREEN NAVIGATION
   ========================================================================= */
function go(name){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $('#s-' + name).classList.add('active');
  document.querySelectorAll('#nav button').forEach(b =>
    b.classList.toggle('on', b.dataset.go === name));
  $('#phone').scrollTop = 0;
  if(name === 'reward') renderReward();
  if(name === 'foods')  renderFoods('');
  if(name === 'combo')  renderComboPairs();
}
document.querySelectorAll('#nav button').forEach(b =>
  b.addEventListener('click', () => go(b.dataset.go)));

/* =========================================================================
   6) VILLAGE + the tap-two friendship check
   ========================================================================= */
function renderGrid(){
  $('#grid').innerHTML = CHARACTERS.map(c => `
    <div class="charcard" data-id="${c.id}">
      ${avatar(c, 74)}
      <div class="nm">${c.name}</div>
      <div class="nt">${c.nutrient}</div>
    </div>`).join('');
  document.querySelectorAll('.charcard').forEach(card =>
    card.addEventListener('click', () => tapChar(card.dataset.id)));
}

function tapChar(id){
  if(pick.length === 2) clearPick();           // start fresh after a completed pair
  const card = document.querySelector(`.charcard[data-id="${id}"]`);
  const i = pick.indexOf(id);
  if(i > -1){ pick.splice(i,1); card.classList.remove('sel'); return; }  // tap again to deselect
  pick.push(id); card.classList.add('sel');
  if(pick.length === 2) showResult(pick[0], pick[1]);
}
function clearPick(){
  pick.length = 0;
  document.querySelectorAll('.charcard.sel').forEach(c => c.classList.remove('sel'));
}

function showResult(a, b){
  const key = ruleKey(a, b);
  const rule = RULES[key] || {type:"fine", verdict:"All good!",
    kid:"These two get along just fine — no special rule needed.", timing:"No special timing"};
  const A = CH[a], B = CH[b];
  const colors = {buddy:['var(--buddy)','var(--buddy-bg)'], space:['var(--space)','var(--space-bg)'], fine:['var(--fine)','var(--fine-bg)']};
  const [fg,bgc] = colors[rule.type];

  // If this is a NEW buddy pair, add it to the collection.
  let isNew = false;
  if(rule.type === "buddy" && !discovered.has(key)){ discovered.add(key); isNew = true; }

  // A matching recipe to offer (only for buddy pairs).
  const recipe = RECIPES.find(r => ruleKey(r.pair[0], r.pair[1]) === key);

  $('#result-body').innerHTML = `
    ${isNew ? '<div class="newbadge">New buddy discovered!</div>' : ''}
    <div class="facepair">${avatar(A, 92)}${avatar(B, 92)}</div>
    <div class="muted" style="font-size:14px">${A.name} + ${B.name}</div>
    <div class="verdict" style="color:${fg}">${rule.verdict}</div>
    <p style="font-size:16px">${rule.kid}</p>
    <span class="chiplabel" style="background:${bgc};color:${fg}">${rule.timing}</span>
    ${recipe ? `<div style="height:14px"></div>
      <button class="btn" onclick="openRecipe('${recipe.id}')">Cook their meal</button>` : ''}
    <div class="expander"><b>For grown-ups:</b> ${grownupNote(rule.type)}</div>`;

  updateProgress();
  go('result');
}
function grownupNote(type){
  if(type==="buddy") return "These nutrients aid each other's absorption — a good pairing in the same meal.";
  if(type==="space") return "These compete for absorption; space them apart, especially as supplements.";
  return "No special timing needed — a balanced, varied diet covers both.";
}

/* =========================================================================
   7) PROGRESS + REWARD (collect all the buddies)
   ========================================================================= */
function updateProgress(){
  const n = discovered.size, total = BUDDY_KEYS.length;
  $('#prog-count').textContent = `${n} / ${total}`;
  $('#prog-bar').style.width = (n/total*100) + '%';
}
function renderReward(){
  const total = BUDDY_KEYS.length, done = discovered.size;
  const complete = done === total;
  const badges = BUDDY_KEYS.map(key => {
    const [x,y] = key.split('_'); const found = discovered.has(key);
    return `<div class="badge ${found?'':'locked'}">
      <div class="bp">${avatar(CH[x], 50)}${avatar(CH[y], 50)}</div>
      <div class="bn">${found ? CH[x].name+' + '+CH[y].name : '???'}</div>
    </div>`;
  }).join('');
  $('#reward-body').innerHTML = `
    ${complete ? `<div class="celebrate"><div style="font-size:30px">★</div>
       <h2 style="margin:6px 0">You found every buddy!</h2>
       <p class="muted" style="margin:0">You're a Vitamin Village champion.</p></div>`
     : `<p class="muted">Find all ${total} buddy pairs in the village to fill your badge book. ${done} down, ${total-done} to go!</p>`}
    <div class="badgegrid">${badges}</div>`;
}

/* =========================================================================
   8) FOOD FINDER
   ========================================================================= */
function renderFoods(query){
  const q = query.trim().toLowerCase();
  const rows = FOODS.filter(f => f.name.toLowerCase().includes(q) || f.cat.toLowerCase().includes(q));
  $('#food-list').innerHTML = rows.length ? rows.map(f => `
    <div class="foodrow">
      <div><div class="fn">${f.name}</div><div class="fc">${f.cat}</div></div>
      <div class="dots">${f.has.map(id =>
        `<div class="dot" style="background:${CH[id].bg};color:${CH[id].ink}">${CH[id].sym}</div>`).join('')}</div>
    </div>`).join('')
    : `<p class="muted center">No foods found. Try another word!</p>`;
}
$('#food-search').addEventListener('input', e => renderFoods(e.target.value));

/* =========================================================================
   9) RECIPES
   ========================================================================= */
function renderRecipeList(){
  $('#recipe-list').innerHTML = RECIPES.map(r => {
    const A = CH[r.pair[0]], B = CH[r.pair[1]];
    return `<div class="recipecard" onclick="openRecipe('${r.id}')">
      <div class="rt">${r.name}</div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="pairbadge">${chip(A)}${chip(B)} ${A.name} + ${B.name}</span>
        <span class="meta">${r.meal} · ${r.prep} min</span>
      </div>
    </div>`;
  }).join('');
}
function openRecipe(id){
  const r = RECIPES.find(x => x.id === id);
  const A = CH[r.pair[0]], B = CH[r.pair[1]];
  $('#recipe-detail').innerHTML = `
    <h1>${r.name}</h1>
    <div class="pairbadge" style="margin-bottom:12px">${chip(A)}${chip(B)} ${A.name} + ${B.name}</div>
    <p>${r.why}</p>
    <div class="meta" style="margin-bottom:16px">${r.meal} · ${r.prep} min · serves ${r.serves}</div>
    <h2>Ingredients</h2>
    <div style="margin-bottom:18px">${r.ingredients.map(checkRow).join('')}</div>
    <h2>Steps</h2>
    <div style="margin-bottom:18px">${r.steps.map((s,i)=>checkRow((i+1)+'. '+s)).join('')}</div>
    <h2>Shopping list</h2>
    <div style="margin-bottom:18px">${r.shopping.map(checkRow).join('')}</div>
    <div class="expander"><b>For grown-ups:</b> ${r.parent}</div>
    <p class="meta" style="margin-top:14px">For learning and fun — not medical advice. Check with a grown-up about allergies.</p>`;
  go('recipe');
}
function checkRow(text){
  return `<div class="check" onclick="this.classList.toggle('done')">
    <span class="box">✓</span><span class="txt">${text}</span></div>`;
}

/* =========================================================================
   9b) COMBO MAKER — suggests buddy-friendly food combos from the FOODS data
   =========================================================================
   This does NOT invent recipes. It surfaces pairs of real foods that carry
   the two nutrients of a buddy team, filtered so the flavours aren't absurd.
   The grown-up still decides what actually tastes good — that's the point.
*/
let comboPair = null;

function foodsWith(nid){ return FOODS.filter(f => f.has.includes(nid)); }

function renderComboPairs(){
  $('#combo-pairs').innerHTML = BUDDY_KEYS.map(key => {
    const [x,y] = key.split('_');
    const on = comboPair === key;
    return `<button onclick="pickCombo('${key}')" style="border:1.5px solid ${on?'var(--ink)':'var(--line)'};
      background:${on?'var(--ink)':'#fff'};color:${on?'#fff':'var(--ink)'};border-radius:999px;
      padding:7px 12px;font-size:12px;font-weight:600">${CH[x].name} + ${CH[y].name}</button>`;
  }).join('') + `<button onclick="pickCombo(BUDDY_KEYS[Math.floor(Math.random()*BUDDY_KEYS.length)])"
      style="border:1.5px dashed var(--line);background:#fff;border-radius:999px;padding:7px 12px;
      font-size:12px;font-weight:600">Surprise me</button>`;
  if(comboPair) shuffleCombo(); else
    $('#combo-card').innerHTML = `<p class="muted center" style="margin-top:24px">Choose a buddy team above to see a food idea.</p>`;
}
function pickCombo(key){ comboPair = key; renderComboPairs(); }

function shuffleCombo(){
  const [x,y] = comboPair.split('_');
  const A = foodsWith(x), B = foodsWith(y);

  // Build every flavour-compatible combo, skipping "same food twice".
  const options = [];
  A.forEach(fa => B.forEach(fb => {
    if(fa.name !== fb.name && flavorOK(fa, fb)) options.push([fa, fb]);
  }));
  // Foods that carry BOTH nutrients are the neatest answer of all — a whole
  // buddy team in one ingredient. Show those sometimes.
  const doubles = FOODS.filter(f => f.has.includes(x) && f.has.includes(y));

  const useDouble = doubles.length && Math.random() < 0.25;
  const total = options.length;

  let body;
  if(useDouble){
    const d = doubles[Math.floor(Math.random()*doubles.length)];
    body = `<div class="newbadge">Double helper!</div>
      <div style="font-size:26px;font-weight:700;margin:8px 0">${d.name}</div>
      <p class="muted">${d.name} carries <b>${CH[x].nutrient}</b> and <b>${CH[y].nutrient}</b> all by itself —
      one food, a whole buddy team.</p>`;
  } else if(total){
    const [fa, fb] = options[Math.floor(Math.random()*total)];
    body = `<div style="display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0">
        <div style="font-size:19px;font-weight:700">${fa.name}</div>
        <div style="color:var(--muted);font-size:18px">+</div>
        <div style="font-size:19px;font-weight:700">${fb.name}</div>
      </div>
      <p class="muted" style="font-size:14px">${fa.name} brings <b>${CH[x].nutrient}</b> ·
        ${fb.name} brings <b>${CH[y].nutrient}</b></p>`;
  } else {
    body = `<p class="muted">No tasty combos found for this team yet.</p>`;
  }

  $('#combo-card').innerHTML = `
    <div class="result">
      <div class="facepair">${avatar(CH[x], 62)}${avatar(CH[y], 62)}</div>
      ${body}
      <div style="height:12px"></div>
      <button class="btn" onclick="shuffleCombo()">Another idea</button>
      <div class="expander" style="font-size:13px"><b>For grown-ups:</b> ${total.toLocaleString()} flavour-friendly
      combinations exist for this team. These are ideas, not tested recipes — you choose what tastes good.</div>
    </div>`;
}

/* =========================================================================
   10) ONBOARDING (a 3-card tutorial shown the first time)
   ========================================================================= */
const OB = [
  {big:"🌟", t:"Welcome to Vitamin Village!",
   b:"Ten tiny helpers live inside you. Some are best buddies, and some need a little space."},
  {big:"👉", t:"Tap two friends",
   b:"In the village, tap any two helpers to find out if they team up or need to stay apart."},
  {big:"★",  t:"Collect all the buddies",
   b:"Every buddy pair you discover earns a badge. Can you find all ten?"},
];
let obStep = 0;
function renderOnboard(){
  const o = OB[obStep];
  $('#ob-content').innerHTML =
    `<div style="font-size:52px;margin-bottom:14px">${o.big}</div>
     <h1 style="font-size:26px">${o.t}</h1>
     <p class="muted" style="font-size:17px">${o.b}</p>`;
  $('#ob-dots').innerHTML = OB.map((_,i)=>`<i class="${i===obStep?'on':''}"></i>`).join('');
  $('#ob-next').textContent = obStep === OB.length-1 ? "Let's go!" : "Next";
}
$('#ob-next').addEventListener('click', () => {
  if(obStep < OB.length-1){ obStep++; renderOnboard(); }
  else $('#onboard').style.display = 'none';   // finish tutorial → show the app
});

/* =========================================================================
   11) START THE APP
   ========================================================================= */
renderGrid();
renderRecipeList();
updateProgress();
renderOnboard();

/* =========================================================================
   12) SERVICE WORKER — makes the app installable + work offline.
   ========================================================================= */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js")
      .then(() => console.log("Vitamin Village: ready to work offline"))
      .catch(err => console.log("Service worker failed:", err));
  });
}
</script>
</body>
</html>
